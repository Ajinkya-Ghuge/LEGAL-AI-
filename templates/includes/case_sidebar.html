<!-- Shared case sidebar -->
<aside class="w-56 bg-white shadow-sidebar flex flex-col flex-shrink-0">
    <div class="h-14 flex items-center px-4 border-b border-gray-100">
        <a href="/dashboard/" class="flex items-center gap-2 nav-logo font-bold text-base">
            <div class="w-7 h-7 bg-primary rounded-lg flex items-center justify-center shadow-sm"><svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg></div>
            LegalAI
        </a>
    </div>
    <div class="px-4 py-3 border-b border-gray-100">
        <p class="text-xs text-gray-400 uppercase tracking-wider mb-0.5 font-medium">Case</p>
        <p class="text-xs font-bold text-primary truncate">{{ case.case_no }}</p>
        <p class="text-xs text-gray-500 truncate mt-0.5">{{ case.name }}</p>
    </div>
    <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto">

        <a href="/cases/{{ case.id }}/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'summary' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span>Summary</span>
        </a>

        <a href="/timeline/?case_id={{ case.id }}" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'visits' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>Medical Timeline</span>
        </a>

        <a href="/cases/{{ case.id }}/injuries/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'injuries' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <span>Injury Analysis</span>
        </a>

        <a href="/cases/{{ case.id }}/treatment/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'treatment' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            <span>Treatment Summary</span>
        </a>

        <a href="/cases/{{ case.id }}/expenses/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'expenses' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Expense &amp; Bills</span>
        </a>

        <a href="/cases/{{ case.id }}/compensation/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'compensation' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            <span>Compensation</span>
        </a>

        <a href="/cases/{{ case.id }}/reports/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'reports' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>AI Reports</span>
        </a>

        <a href="/cases/{{ case.id }}/drafts/" class="sidebar-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm {% if active_tab == 'drafts' %}active{% else %}text-gray-600{% endif %}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            <span>Draft Documents</span>
        </a>

    </nav>
    <div class="border-t border-gray-100 px-4 py-3">
        <a href="/cases/" class="text-xs text-gray-400 hover:text-primary flex items-center gap-1.5 transition-colors font-medium"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>All Cases</a>
    </div>
</aside>
