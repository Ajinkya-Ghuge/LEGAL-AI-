<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LegalAI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7B2C2C',
                        'primary-dark': '#5a1f1f',
                        accent: '#C86F6F',
                        'accent-light': '#e8b4b4',
                        bg: '#F8F6F4',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Georgia', 'Times New Roman', 'serif'],
                    },
                    boxShadow: {
                        'card': '0 1px 4px rgba(0,0,0,0.07), 0 2px 12px rgba(0,0,0,0.04)',
                        'card-hover': '0 4px 20px rgba(0,0,0,0.10)',
                        'sidebar': '2px 0 12px rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8F6F4; font-family: 'Inter', sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #e0d8d0; border-radius: 2px; }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-item { transition: all 0.15s ease; }
        .sidebar-item:hover { background-color: #f5f0ec; }
        .sidebar-item.active { background-color: #7B2C2C; color: white; }
        .sidebar-item.active svg { color: white !important; }
        .btn-primary { background-color: #7B2C2C; color: white; transition: background-color 0.15s; }
        .btn-primary:hover { background-color: #5a1f1f; }
        .chat-bubble-ai { background: white; border: 1px solid #f0ebe6; }
        .chat-bubble-user { background: #7B2C2C; color: white; }
        .tag-emergency { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .tag-visit { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .tag-specialist { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .tag-chiropractic { background: #faf5ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        .section-card { border: 1px solid #f0ebe6; transition: box-shadow 0.15s; }
        .section-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-logo { color: #7B2C2C; }
        input:focus, textarea:focus { outline: none; border-color: #C86F6F; box-shadow: 0 0 0 3px rgba(200,111,111,0.15); }
        .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-bg">
    {% block body %}{% endblock %}
    <script>
        function showToast(message, type) {
            var t = type || 'success';
            var el = document.createElement('div');
            el.className = 'fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl text-sm font-medium shadow-lg fade-in ' + (t === 'success' ? 'bg-primary text-white' : 'bg-red-600 text-white');
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 3000);
        }
        function getCsrfToken() {
            var el = document.querySelector('[name=csrfmiddlewaretoken]');
            if (el) return el.value;
            var m = document.cookie.match(/csrftoken=([^;]+)/);
            return m ? m[1] : '';
        }
        var _origFetch = window.fetch;
        window.fetch = function(url, opts) {
            opts = opts || {};
            if (opts.method && opts.method.toUpperCase() === 'POST') {
                opts.headers = opts.headers || {};
                opts.headers['X-CSRFToken'] = getCsrfToken();
            }
            return _origFetch(url, opts);
        };
        function toggleSection(id) {
            var el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
