{% extends "base.html" %}
{% block title %}Error — LegalAI{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-bg">
    <div class="text-center max-w-md mx-auto px-6">
        <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-6"><svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div>
        <h1 class="text-xl font-semibold text-gray-800 mb-2">Something went wrong</h1>
        <p class="text-sm text-gray-500 mb-6">{{ message|default:"An unexpected error occurred." }}</p>
        <a href="/dashboard/" class="btn-primary text-sm px-6 py-2.5 rounded-xl inline-block">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}
